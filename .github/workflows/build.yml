name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so rapid pushes do not queue redundant
# (and expensive, wheel-building) runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    name: qa (lint + typecheck + test)

    steps:
      - uses: actions/checkout@v7

      # uv sync builds the C extension from source, which links ALSA on Linux
      # (RtMidi/PortAudio); install the headers here as the test-source job does.
      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ tests/ demos/

      - name: Format check
        run: uv run ruff format --check src/ tests/ demos/

      - name: Type check
        run: uv run mypy --strict src/

      - name: Test
        run: uv run pytest tests/

  test-source:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    runs-on: ubuntu-latest
    name: test (source, py${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v7

      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync (builds the C extension from the source tree)
        run: uv sync

      - name: Test
        run: uv run pytest tests/

  test-realtime:
    # Boots a GENUINE in-process scsynth World and exercises the live paths the
    # rest of the suite mocks: the /sync -> /synced round-trip, reclaiming
    # allocators, /n_end node-free notifications, reboot, and the GIL/mutex
    # deadlock regression (tests/test_realtime_smoke.py). These are skipped by
    # default (NANOSYNTH_TEST_REALTIME unset); this job opts in for scsynth.
    #
    # Supernova real-boot is intentionally NOT enabled here yet: it has a
    # separate, pre-existing teardown/reboot crash (terminate() does not always
    # unblock supernova_run(), and process-exit teardown can segfault). Add a
    # `NANOSYNTH_TEST_REALTIME=supernova` job in its own process once that is
    # fixed and verified -- the one-engine-per-process rule still stands.
    runs-on: ubuntu-latest
    name: test (realtime, scsynth)

    steps:
      - uses: actions/checkout@v7

      - name: Install ALSA dev headers + tools
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev alsa-utils

      - name: Provide a virtual (userspace) audio device
        # A headless runner has no audio hardware, and the Ubuntu "azure"
        # kernel that GitHub runners boot ships no sound modules at all -- not
        # even snd.ko -- so `modprobe snd-dummy` can never succeed here. Both
        # backends below are pure userspace.
        #
        # Preferred: a PulseAudio null sink reached through the ALSA "pulse"
        # plugin. Its timer-based scheduling keeps realtime pacing honest,
        # which the scheduled-bundle and node-free assertions in the smoke test
        # depend on.
        #
        # Fallback: the alsa-lib "null" PCM, which needs no daemon but never
        # blocks, so scsynth free-runs on a meaningless clock. Weaker, but it
        # still boots and exercises the OSC round-trip.
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils libasound2-plugins || true

          # Pin the runtime dir so every later step (and the daemon) agree on
          # where the socket lives; the runner's default may be unset.
          export XDG_RUNTIME_DIR="$HOME/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

          backend=null
          if pulseaudio --start --exit-idle-time=-1 --disallow-exit --log-target=stderr; then
            for _ in $(seq 1 20); do
              pactl info >/dev/null 2>&1 && break
              sleep 0.5
            done
            if pactl load-module module-null-sink sink_name=dummy \
                 sink_properties=device.description=Dummy >/dev/null &&
               pactl set-default-sink dummy; then
              backend=pulse
            fi
          fi

          if [ "$backend" = pulse ]; then
            printf 'pcm.!default { type pulse }\nctl.!default { type pulse }\n' > "$HOME/.asoundrc"
            echo "PULSE_SERVER=unix:$XDG_RUNTIME_DIR/pulse/native" >> "$GITHUB_ENV"
            # scsynth opens an input stream too; the sink's monitor is the only
            # source there is. (It clamps its 8-in/8-out request to whatever
            # the device reports, so a stereo null sink is enough.)
            pactl set-default-source dummy.monitor || true
            pactl list short sinks
          else
            echo "PulseAudio unavailable -- falling back to the alsa-lib null PCM"
            printf 'pcm.!default { type null }\nctl.!default { type null }\n' > "$HOME/.asoundrc"
          fi
          echo "audio backend: $backend"
          aplay -L 2>/dev/null | head -20 || true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"

      - name: Sync (builds the C extension from the source tree)
        run: uv sync

      - name: Realtime smoke (scsynth)
        env:
          NANOSYNTH_TEST_REALTIME: scsynth
        run: uv run pytest tests/test_realtime_smoke.py -v

  benchmarks:
    # Manual only: the double build (HEAD + HEAD^) is expensive, so this runs
    # on demand via the Actions "Run workflow" button, not on every push/PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: benchmarks (regression gate)

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"

      - name: Benchmark HEAD
        run: |
          uv sync
          uv run pytest benchmarks/ --benchmark-disable-gc --benchmark-json=/tmp/head.json -q

      - name: Benchmark base (HEAD^) with the HEAD harness
        run: |
          # Pin the benchmark harness from HEAD, then rebuild the library at
          # HEAD^ so the comparison measures library changes, not harness
          # changes -- both runs happen on this one runner (apples to apples).
          cp -r benchmarks /tmp/harness
          git checkout HEAD^
          rm -rf benchmarks && cp -r /tmp/harness benchmarks
          uv sync
          uv run pytest benchmarks/ --benchmark-disable-gc --benchmark-json=/tmp/base.json -q

      - name: Compare (fail on gross regression)
        # 50% here (vs 25% locally): a shared CI runner is noisier than a quiet
        # dev machine, so CI gates only gross/algorithmic regressions. Run
        # `make bench-check` locally for the tighter developer gate.
        run: uv run python /tmp/harness/check_regression.py /tmp/base.json /tmp/head.json --threshold 50

  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: ubuntu-latest
            arch: x86_64
          - os: windows-latest
            arch: AMD64

    runs-on: ${{ matrix.os }}
    name: wheels / ${{ matrix.os }} (${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v7

      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_TEST_REQUIRES: pytest numpy hypothesis
          CIBW_TEST_COMMAND: pytest {project}/tests/
          CIBW_BEFORE_ALL_LINUX: yum install -y alsa-lib-devel || apt-get install -y libasound2-dev

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    name: sdist

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Build sdist
        run: uv build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  aggregate:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    name: aggregate artifacts

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7
        with:
          name: all-dist
          path: dist/
