name: Docs
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      # The mkdocs/mkdocstrings dependencies live in the default `dev` group,
      # which `uv sync` installs; mkdocstrings also needs the package built and
      # importable, which `uv sync` provides.
      - run: uv sync
      - run: uv run mkdocs gh-deploy --force
