name: Docs
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      # The mkdocs/mkdocstrings dependencies live in the default `dev` group,
      # which `uv sync` installs; mkdocstrings also needs the package built and
      # importable, which `uv sync` provides.
      - run: uv sync
      - run: uv run mkdocs gh-deploy --force
