name: Release-OPT

# Optional: version-specific (non-abi3) wheels for every CPython, attached to an
# existing GitHub release made by release-abi3.yml (no PyPI, no release notes).
# Dispatch-only, so a tag push runs release-abi3.yml alone.
on:
  workflow_dispatch:
    inputs:
      github-release:
        description: "Attach wheels to the GitHub release"
        required: true
        default: true
        type: boolean
      tag_name:
        description: "Tag of the (draft) release to attach to, when run from a branch"
        required: false
        default: ""
        type: string

jobs:
  # Resolves the release tag (empty on a branch dispatch without tag_name) and
  # fails fast, before any build, if it is malformed or not the package version.
  tag:
    runs-on: ubuntu-latest
    name: resolve tag
    outputs:
      name: ${{ steps.tag.outputs.name }}
      prerelease: ${{ steps.tag.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve and check tag
        id: tag
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name }}
        run: |
          if [[ -n "$TAG" ]]; then
            [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]] \
              || { echo "::error::tag '$TAG' is not <major>.<minor>.<patch>[a|b|rc<N>]"; exit 1; }
            VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
            [[ "$TAG" == "$VERSION" ]] \
              || { echo "::error::tag '$TAG' does not match pyproject.toml version '$VERSION'"; exit 1; }
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$TAG" =~ [a-z] ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build-wheels:
    needs: [tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: ubuntu-latest
            arch: x86_64
          - os: windows-latest
            arch: AMD64

    runs-on: ${{ matrix.os }}
    name: wheels / ${{ matrix.os }} (${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v7

      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          # Empty py-api overrides pyproject's cp312 and disables the stable ABI.
          CIBW_CONFIG_SETTINGS: "wheel.py-api="
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_TEST_REQUIRES: pytest numpy hypothesis
          CIBW_TEST_COMMAND: pytest {project}/tests/
          CIBW_BEFORE_ALL_LINUX: yum install -y alsa-lib-devel || apt-get install -y libasound2-dev

      - name: Check no abi3 wheels
        shell: bash
        run: "! ls wheelhouse/*-abi3-*.whl 2>/dev/null"

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  github-release:
    needs: [tag, build-wheels]
    runs-on: ubuntu-latest
    name: github release assets
    if: needs.tag.outputs.name != '' && inputs.github-release
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      # Attach only: fails if release-abi3.yml has not created the release, and
      # never touches its title or notes.
      - name: Upload wheels to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.name }}
        run: gh release upload "$TAG" dist/*.whl --clobber --repo "$GITHUB_REPOSITORY"
